name: Wheel Strategy - NVDA

# Buy $10,000 in NVDA then run the wheel: sell covered calls → if called away → sell puts → repeat
# Runs every 15 min during market hours (9:00 AM - 4:00 PM ET, Mon-Fri)

on:
  schedule:
    - cron: '*/15 13-20 * * 1-5'  # Every 15 min Mon-Fri, covers 9:00 AM - 4:00 PM ET
  workflow_dispatch:                # allow manual trigger from GitHub UI

concurrency:
  group: wheel-nvda
  cancel-in-progress: false

jobs:
  rueda:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install alpaca-py

      - name: Ejecutar estrategia rueda NVDA
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python Wheel/rueda_nvda.py

      - name: Guardar estado
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Wheel/estado_rueda_nvda.json
          git add Wheel/resumen_diario_nvda.json || true
          git commit -m "Estado rueda NVDA [skip ci]" || echo "Sin cambios"
          git push origin HEAD:${{ github.ref_name }}
