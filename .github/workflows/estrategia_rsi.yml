name: Estrategia RSI + OBV + VWAP (APH / ZTS)

# Señal LONG cuando RSI(14) cruza por encima de 30 + OBV alcista + precio < VWAP
# Stop: 2x ATR | Take Profit: 4x ATR | Riesgo: 3% del capital por operación

on:
  schedule:
    - cron: '*/15 13-20 * * 1-5'  # Cada 15 min, Lunes-Viernes, horario de mercado ET
  workflow_dispatch:                # Trigger manual desde GitHub UI

concurrency:
  group: estrategia-rsi
  cancel-in-progress: false

jobs:
  rsi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install alpaca-py numpy

      - name: Ejecutar estrategia RSI
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python RSI/estrategia_rsi.py

      - name: Guardar estado
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add RSI/estado_rsi.json
          git commit -m "Estado RSI APH/ZTS [skip ci]" || echo "Sin cambios"
          git push origin HEAD:${{ github.ref_name }}
