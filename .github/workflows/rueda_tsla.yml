name: Wheel Strategy - TSLA

# The Wheel: sell cash-secured puts → get assigned → sell covered calls → repeat
# Runs every 15 min during market hours (9:00 AM - 4:00 PM ET, Mon-Fri)

on:
  schedule:
    - cron: '*/15 13-20 * * 1-5'  # Every 15 min Mon-Fri, 9:00 AM - 4:00 PM ET
  workflow_dispatch:                # allow manual trigger from GitHub UI

concurrency:
  group: wheel-tsla
  cancel-in-progress: false

jobs:
  rueda:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install alpaca-py

      - name: Ejecutar estrategia rueda
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python Wheel/rueda_tsla.py

      - name: Guardar estado
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Wheel/estado_rueda.json
          git add Wheel/resumen_diario.json || true
          git commit -m "Estado rueda TSLA [skip ci]" || echo "Sin cambios"
          git push origin HEAD:${{ github.ref_name }}
